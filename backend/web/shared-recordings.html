<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MIT SCL recording progress</title>
  <style>
    :root { color-scheme:light; --bg:#f4f6f8; --panel:#fff; --text:#17202a; --muted:#667085; --line:#d8dee7; --green:#1f9d55; --yellow:#d99a14; --red:#d64545; --blue:#1769aa; }
    * { box-sizing:border-box }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,sans-serif }
    main { width:min(1180px,calc(100% - 32px)); margin:32px auto }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:18px }
    h1 { margin:0; font-size:24px } h2 { margin:0; font-size:18px }
    .muted { color:var(--muted) }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px }
    .hidden { display:none!important }
    button,input { font:inherit }
    button { border:1px solid var(--line); border-radius:8px; background:#fff; padding:7px 11px; cursor:pointer }
    button.primary { background:var(--blue); color:#fff; border-color:var(--blue) }
    input { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px }
    #unlock { width:min(420px,100%); margin:12vh auto }
    #unlock form { display:grid; gap:12px }
    #error { color:var(--red); min-height:20px }
    .table-wrap { overflow:auto }
    table { width:100%; border-collapse:collapse; min-width:850px }
    th,td { text-align:left; vertical-align:top; padding:9px 10px; border-bottom:1px solid var(--line) }
    th { color:var(--muted); font-size:12px; font-weight:600 }
    tr:last-child td { border-bottom:0 }
    a { color:var(--blue); text-decoration:none } a:hover { text-decoration:underline }
    .name { font-weight:650 }.sub { margin-top:2px; color:var(--muted); font-size:12px }
    .state { display:inline-flex; align-items:center; gap:6px; text-transform:capitalize }
    .state::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--muted) }
    .state.active::before { background:var(--green) }.state.paused::before { background:var(--yellow) }.state.completed::before { background:var(--blue) }
    .strip { display:grid; grid-template-columns:repeat(12,8px); align-items:end; gap:2px; height:26px; margin-top:5px }
    .strip i,.strip button { display:block; width:8px; min-height:3px; padding:0; border:0; border-radius:2px; background:var(--line) }
    .strip button:focus-visible { outline:2px solid #111; outline-offset:1px }
    .healthy { background:var(--green)!important }.warning { background:var(--yellow)!important }.critical { background:var(--red)!important }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin:14px 0 }
    .metric { border:1px solid var(--line); border-radius:9px; padding:10px }.metric b { display:block; font-size:18px }
    .heat-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:18px 0 10px }
    .heatmap { display:grid; gap:4px; overflow:auto }
    .heat-row { display:grid; gap:3px; min-width:720px; align-items:center }
    .heat-label { color:var(--muted); font-size:12px }
    .heat-cell { width:100%; aspect-ratio:1; min-width:17px; padding:0; border:0; border-radius:3px; background:#e9edf2 }
    .heat-cell:focus-visible { outline:3px solid #111; outline-offset:1px }
    #tooltip { position:fixed; z-index:20; pointer-events:none; max-width:330px; padding:7px 9px; border-radius:7px; background:#111827; color:#fff; font-size:12px; box-shadow:0 4px 18px #0004 }
    .back { display:inline-block; margin-bottom:12px }
    .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; color:var(--muted); font-size:12px }.legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px }
    @media(max-width:650px){ main{width:min(100% - 18px,1180px);margin:18px auto} header{align-items:start;flex-direction:column}.panel{padding:12px} }
  </style>
</head>
<body>
  <main>
    <section id="unlock" class="panel hidden">
      <h1>MIT SCL recording progress</h1>
      <p class="muted">Enter the team password for read-only access.</p>
      <form id="unlockForm">
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">View recordings</button>
        <div id="error" role="alert"></div>
      </form>
    </section>
    <section id="app" class="hidden">
      <header>
        <div><h1>MIT SCL recording progress</h1><div class="muted">Read-only capture status and health</div></div>
        <button id="logout" type="button">Log out</button>
      </header>
      <div id="content"></div>
    </section>
  </main>
  <div id="tooltip" class="hidden" role="tooltip"></div>
  <script>
    const SHARED_PATH = '/shared/__SHARED_RECORDINGS_SLUG__';
    const API = '/api/v1' + SHARED_PATH;
    const unlock = document.getElementById('unlock');
    const app = document.getElementById('app');
    const content = document.getElementById('content');
    const tooltip = document.getElementById('tooltip');
    const escapeHTML = (value) => String(value == null ? '' : value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    async function request(path, options) {
      const response = await fetch(API + path, { credentials:'same-origin', headers:{ Accept:'application/json', ...(options && options.headers || {}) }, ...options });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) { const error = new Error(body.error || `Request failed (${response.status})`); error.status=response.status; throw error; }
      return body;
    }
    function percent(captured, expected) { return expected > 0 ? Math.round(captured / expected * 1000) / 10 : 0; }
    function dateTime(value, timezone) {
      if (!value) return '';
      return new Intl.DateTimeFormat([], { timeZone:timezone, month:'short',day:'numeric',hour:'numeric',minute:'2-digit' }).format(new Date(value));
    }
    function schedule(rec) {
      if (rec.mode === 'continuous') return `Daily ${rec.daily_window_start}–${rec.daily_window_end}`;
      return rec.cron_expr ? `Cron ${rec.cron_expr}` : 'Sampled';
    }
    function captureLocation(rec) {
      if (rec.capture_via !== 'relay') return 'Stoarama cloud';
      return rec.relay_node_name || 'Waiting for relay';
    }
    function healthStrip(bins) {
      const cells = Array.from({length:Math.max(0,12-bins.length)},()=>'<i></i>');
      for (const bin of bins.slice(-12)) {
        const p=percent(Number(bin.captured),Number(bin.expected));
        const title=`${p}% (${bin.captured}/${bin.expected})`;
        cells.push(`<button type="button" class="${escapeHTML(bin.health)}" style="height:${Math.max(3,Math.min(100,p))}%" data-tip="${escapeHTML(title)}" aria-label="${escapeHTML(title)}"></button>`);
      }
      return `<div class="strip" aria-label="Recent scheduled capture health">${cells.join('')}</div>`;
    }
    function recordingRow(rec) {
      const captured=Number(rec.captured_clip_count||0), expected=Number(rec.expected_clip_count||0);
      const title=rec.stream_name||rec.name||`Recording #${rec.id}`;
      return `<tr>
        <td><a class="name" href="${SHARED_PATH}/recordings/${rec.id}">#${rec.id} ${escapeHTML(title)}</a><div class="sub">${escapeHTML(rec.stream_location||'')}${rec.stream_id?` · Stream #${rec.stream_id}`:''}</div></td>
        <td><span class="state ${escapeHTML(rec.status)}">${escapeHTML(rec.status)}</span><div class="sub">${percent(captured,expected)}% · ${captured}/${expected}</div>${healthStrip(rec.capture_health_bins||[])}</td>
        <td>${escapeHTML(schedule(rec))}<div class="sub">${escapeHTML(rec.cron_timezone)}</div></td>
        <td>${escapeHTML(rec.capture_via)}${rec.relay_node_name?` · ${escapeHTML(rec.relay_node_name)}`:''}<div class="sub">Last clip ${escapeHTML(dateTime(rec.last_clip_at,rec.cron_timezone)||'none')}</div></td>
      </tr>`;
    }
    async function renderList() {
      const payload=await request('/recordings');
      const items=payload.recordings||[];
      content.innerHTML=`<div class="panel table-wrap"><table><thead><tr><th>Recording</th><th>Status / health</th><th>Schedule</th><th>Capture</th></tr></thead><tbody>${items.map(recordingRow).join('')}</tbody></table></div>`;
    }
    function localParts(value, timezone) {
      const parts={};
      for (const part of new Intl.DateTimeFormat('en-CA',{timeZone:timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23',timeZoneName:'short'}).formatToParts(new Date(value))) parts[part.type]=part.value;
      return { date:`${parts.year}-${parts.month}-${parts.day}`, hour:Number(parts.hour), zone:parts.timeZoneName||'' };
    }
    function heatmap(page) {
      const days=new Map();
      for(let day=new Date(page.from+'T12:00:00Z'),last=new Date(page.to+'T12:00:00Z');day<=last;day=new Date(day.getTime()+86400000)) {
        days.set(day.toISOString().slice(0,10),Array.from({length:24},()=>[]));
      }
      for (const bin of page.bins||[]) {
        const local=localParts(bin.start,page.timezone);
        if (!days.has(local.date)) days.set(local.date,Array.from({length:24},()=>[]));
        days.get(local.date)[local.hour].push({...bin,localZone:local.zone});
      }
      const rows=[...days.entries()].sort(([left],[right])=>left.localeCompare(right)).map(([date,hours])=>{
        const slots=hours.flatMap((bins,hour)=>bins.length?bins.map(bin=>({bin,hour})):[{bin:null,hour}]);
        return `<div class="heat-row" style="grid-template-columns:92px repeat(${slots.length},minmax(19px,1fr))"><div class="heat-label">${date}</div>${slots.map(({bin,hour})=>{
        if(!bin)return '<span class="heat-cell" aria-hidden="true"></span>';
        const p=percent(bin.captured,bin.expected), health=bin.health||(p>=98?'healthy':p>=90?'warning':'critical');
        const title=`${date} ${String(hour).padStart(2,'0')}:00${bin.localZone?` ${bin.localZone}`:''} · ${p}% of expected clips captured (${bin.captured}/${bin.expected})`;
        return `<button class="heat-cell ${health}" type="button" data-tip="${escapeHTML(title)}" aria-label="${escapeHTML(title)}"></button>`;
      }).join('')}</div>`;
      }).join('');
      return `<div class="heatmap">${rows||'<p class="muted">No scheduled hours in this period.</p>'}</div>`;
    }
    async function renderDetail(id, to) {
      const rec=await request(`/recordings/${id}`);
      const query=to?`?to=${encodeURIComponent(to)}`:'';
      const page=await request(`/recordings/${id}/capture-health${query}`);
      const captured=Number(rec.captured_clip_count||0), expected=Number(rec.expected_clip_count||0);
      content.innerHTML=`<a class="back" href="${SHARED_PATH}/recordings">← All recordings</a>
        <div class="panel"><h2>#${rec.id} ${escapeHTML(rec.stream_name||rec.name)}</h2><div class="muted">${escapeHTML(rec.stream_location||'')} · ${escapeHTML(rec.cron_timezone)}</div>
        <div class="metrics"><div class="metric"><span class="muted">Status</span><b>${escapeHTML(rec.status)}</b></div><div class="metric"><span class="muted">Capture health</span><b>${percent(captured,expected)}%</b><span>${captured}/${expected} clips</span></div><div class="metric"><span class="muted">Schedule</span><b>${escapeHTML(schedule(rec))}</b><span>${rec.clip_duration_sec}s clips</span></div><div class="metric"><span class="muted">Capture</span><b>${escapeHTML(rec.capture_via)}</b><span>${escapeHTML(captureLocation(rec))}</span></div></div>
        <div class="heat-head"><div><h2>Hourly capture health</h2><span class="muted">${page.from} through ${page.to}, local time</span></div><div><button id="older">Older</button> <button id="newer">Newer</button></div></div>
        ${heatmap(page)}
        <div class="legend"><span><i class="healthy"></i>98% or better</span><span><i class="warning"></i>90–97.9%</span><span><i class="critical"></i>Below 90%</span><span><i></i>Not scheduled</span></div></div>`;
      const older=document.getElementById('older');older.disabled=!page.has_older;older.onclick=()=>renderDetail(id,new Date(new Date(page.from+'T12:00:00Z').getTime()-86400000).toISOString().slice(0,10));
      const newer=document.getElementById('newer'); newer.disabled=!page.has_newer; newer.onclick=()=>{
        const pageDuration=new Date(page.to+'T12:00:00Z')-new Date(page.from+'T12:00:00Z')+86400000;
        const candidate=new Date(new Date(page.to+'T12:00:00Z').getTime()+pageDuration);
        const candidateDate=candidate.toISOString().slice(0,10), localToday=localParts(new Date().toISOString(),page.timezone).date;
        renderDetail(id,candidateDate>localToday?localToday:candidateDate);
      };
    }
    function showTooltip(target) {
      const text=target&&target.dataset.tip;if(!text)return;
      tooltip.textContent=text;tooltip.classList.remove('hidden');
      const r=target.getBoundingClientRect(),t=tooltip.getBoundingClientRect();
      tooltip.style.left=`${Math.max(8,Math.min(innerWidth-t.width-8,r.left+r.width/2-t.width/2))}px`;
      tooltip.style.top=`${Math.max(8,r.top-t.height-7)}px`;
    }
    document.addEventListener('pointerover',e=>showTooltip(e.target.closest('[data-tip]')));
    document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))tooltip.classList.add('hidden')});
    document.addEventListener('focusin',e=>showTooltip(e.target.closest('[data-tip]')));
    document.addEventListener('focusout',e=>{if(e.target.closest('[data-tip]'))tooltip.classList.add('hidden')});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')tooltip.classList.add('hidden')});
    async function start() {
      try {
        const match=location.pathname.match(/\/recordings\/(\d+)$/);
        if(match)await renderDetail(match[1]);else await renderList();
        unlock.classList.add('hidden');app.classList.remove('hidden');
      } catch(error) {
        if(error.status===401){app.classList.add('hidden');unlock.classList.remove('hidden');document.getElementById('password').focus();return}
        content.innerHTML=`<div class="panel" style="color:var(--red)">${escapeHTML(error.message)}</div>`;app.classList.remove('hidden');
      }
    }
    document.getElementById('unlockForm').onsubmit=async(event)=>{
      event.preventDefault();document.getElementById('error').textContent='';
      try{await request('/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});await start()}
      catch(error){document.getElementById('error').textContent=error.message}
    };
    document.getElementById('logout').onclick=async()=>{await request('/logout',{method:'POST'});location.reload()};
    start();
  </script>
</body>
</html>
