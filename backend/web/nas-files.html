<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stoarama NAS Files</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0a0f1a;--panel:#111827;--panel2:#182233;--text:#e2e8f0;--muted:#94a3b8;--border:#1e293b;--accent:#06b6d4;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--mono:"IBM Plex Mono",monospace;--sans:"IBM Plex Sans",system-ui,sans-serif;}
    @media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--panel:#fff;--panel2:#f8fafc;--text:#0f172a;--muted:#4b5563;--border:#e2e8f0;--accent:#0891b2;--ok:#16a34a;--warn:#d97706;--err:#dc2626;}}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font:14px var(--sans);color:var(--text);background:radial-gradient(circle at top left,color-mix(in srgb,var(--accent) 10%,transparent),transparent 28%),var(--bg)}
    a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}.shell{max-width:1440px;margin:auto;padding:18px 20px 42px}.content{display:grid;gap:14px}.panel{background:color-mix(in srgb,var(--panel) 94%,#000);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 22px 50px rgba(15,23,42,.18)}
    .head,.toolbar,.folder-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.eyebrow{font:11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}h1{font-size:22px;margin:3px 0 5px}.muted,.status{color:var(--muted);line-height:1.45}.status.err{color:var(--err)}
    select,button{min-height:38px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);padding:8px 12px;font:inherit}button{cursor:pointer;background:transparent;border-width:1.5px;border-color:var(--muted)}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}.connection-select{min-width:min(340px,80vw)}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}.stat{padding:11px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--panel2) 72%,transparent)}.stat b{display:block;font:13px var(--mono);margin-top:4px}.stat.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--border))}.stat.warn b{color:var(--warn)}.stat.err{border-color:color-mix(in srgb,var(--err) 55%,var(--border))}.stat.err b{color:var(--err)}
    .breadcrumbs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}.breadcrumbs button,.folder{padding:0;border:0;min-height:0;background:none;color:var(--accent);text-align:left}.breadcrumbs button:hover,.folder:hover{text-decoration:underline}.folder{font-weight:600}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.table-wrap{overflow:auto;margin-top:12px;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:900px;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:500}tbody tr:last-child td{border-bottom:0}.name{max-width:420px;overflow-wrap:anywhere}.mono{font-family:var(--mono)}.sha{max-width:230px;overflow-wrap:anywhere;color:var(--muted)}.state-ok{color:var(--ok)}.state-warn{color:var(--warn)}.state-err{color:var(--err)}.pager{margin-top:12px}.empty{text-align:center;padding:34px;color:var(--muted)}
    @media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.shell{padding:12px}.panel{padding:14px;border-radius:14px}.stats{grid-template-columns:1fr}.connection-select{width:100%}}
  </style>
  <!--SHELL_HEAD-->
</head>
<body>
  <div class="shell">
    <!--SHELL_TOPBAR-->
    <main class="content">
      <section class="panel">
        <div class="head">
          <div><div class="eyebrow">Storage reconciliation</div><h1>NAS files</h1><div class="muted">The filesystem reported by your NAS, reconciled against Stoarama's server clips.</div></div>
          <div><label class="eyebrow" for="connectionSelect">Connection</label><br><select id="connectionSelect" class="connection-select" aria-label="NAS connection"></select></div>
        </div>
        <div id="connectionStatus" class="status">Loading connections…</div>
        <div id="connectionStats" class="stats" hidden></div>
      </section>
      <section class="panel">
        <div class="folder-head">
          <div><div class="eyebrow">Current folder</div><div id="breadcrumbs" class="breadcrumbs" aria-label="Current NAS folder"></div></div>
          <div class="actions"><button id="upButton" type="button">Up one folder</button><a id="csvLink" href="#">Download full manifest CSV</a></div>
        </div>
        <div id="folderSummary" class="status"></div>
        <div class="table-wrap"><table><thead><tr><th></th><th>Name</th><th>Size</th><th>Reconciliation</th><th>SHA-256</th><th>Verified</th></tr></thead><tbody id="fileRows"><tr><td colspan="6" class="empty">Choose a NAS connection.</td></tr></tbody></table></div>
        <div class="pager"><button id="moreButton" type="button" hidden>Load next 200</button></div>
      </section>
    </main>
    <!--SHELL_FOOTER-->
  </div>
  <script>
    const connectionSelect=document.getElementById('connectionSelect');
    const connectionStatus=document.getElementById('connectionStatus');
    const connectionStats=document.getElementById('connectionStats');
    const breadcrumbs=document.getElementById('breadcrumbs');
    const folderSummary=document.getElementById('folderSummary');
    const fileRows=document.getElementById('fileRows');
    const upButton=document.getElementById('upButton');
    const csvLink=document.getElementById('csvLink');
    const moreButton=document.getElementById('moreButton');
    let connections=[]; let currentConnection=0; let currentPath=''; let nextCursor=''; let requestGeneration=0; let shown=0; let rootServerOnly=0; let treeFresh=false; let treeConsistent=false; let treeGeneration='';
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function bytes(value){const n=Number(value);if(!Number.isFinite(n)||n<=0)return'0 B';const u=['B','KB','MB','GB','TB','PB'];const e=Math.min(Math.floor(Math.log(n)/Math.log(1024)),u.length-1);const a=n/(1024**e);return`${a.toFixed(a>=100||e===0?0:1)} ${u[e]}`;}
    function when(value){if(!value)return'never';const d=new Date(value);return Number.isNaN(d.getTime())?'unknown':d.toLocaleString();}
    async function fetchJSON(url,options={}){const response=await fetch(url,{credentials:'same-origin',headers:{Accept:'application/json',...(options.headers||{})},...options});const data=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(data.error||`Request failed (${response.status})`);error.status=response.status;throw error;}return data;}
    function stat(label,value,detail='',cls=''){return`<div class="stat ${cls}"><span class="eyebrow">${esc(label)}</span><b>${esc(value)}</b>${detail?`<span class="muted">${esc(detail)}</span>`:''}</div>`;}
    function renderConnection(connection){
      if(!connection){connectionStats.hidden=true;connectionStatus.textContent='No NAS connection selected.';return;}
      const mismatches=Number(connection.inventory_mismatches||0), unmatched=Number(connection.inventory_unmatched||0), scan=connection.inventory_scan_completed_at;
      connectionStatus.className='status'+(mismatches?' err':'');
      connectionStatus.textContent=scan?`Inventory generation ${connection.inventory_generation||'unknown'} completed ${when(scan)}.`:'A full inventory scan has not completed yet. Server copies remain protected.';
      connectionStats.innerHTML=stat('NAS inventory',`${Number(connection.inventory_clips||0).toLocaleString()} files`,bytes(connection.inventory_bytes||0))
        +stat('Mismatches',mismatches.toLocaleString(),'path, size, or checksum',mismatches?'err':'')
        +stat('NAS only',unmatched.toLocaleString(),'not linked to a server clip',unmatched?'warn':'')
        +stat('Safety gate',connection.inventory_mode==='enforce'?'Enforced':'Observing',scan?'recent exact proof required':'full scan pending',connection.inventory_mode==='enforce'?'':'warn')
        +stat('Last report',when(connection.inventory_reported_at),connection.client_version||'client version unknown');
      connectionStats.hidden=false;
    }
    function renderBreadcrumbs(path){const parts=String(path||'').split('/').filter(Boolean);let built='';const html=[`<button type="button" data-path="">NAS</button>`];for(const part of parts){built=built?`${built}/${part}`:part;html.push('<span aria-hidden="true">/</span>',`<button type="button" data-path="${esc(built)}">${esc(part)}</button>`);}breadcrumbs.innerHTML=html.join('');breadcrumbs.querySelectorAll('[data-path]').forEach(button=>button.addEventListener('click',()=>loadFolder(button.dataset.path||'')));}
    function reconciliationClass(value){return value==='confirmed'&&treeFresh&&treeConsistent?'state-ok':value==='mismatch'||value==='ambiguous'?'state-err':'state-warn';}
    function rowHTML(item){const directory=item.kind==='directory';const count=Number(item.descendant_files||0);const mismatch=Number(item.mismatch_files||0);const stale=Number(item.stale_files||0);const ambiguous=Number(item.ambiguous_files||0);const nasOnly=Number(item.nas_only_files||0);const unsafe=mismatch||stale||ambiguous||nasOnly||!treeFresh||!treeConsistent;const state=directory?`${count.toLocaleString()} file${count===1?'':'s'}${mismatch?` · ${mismatch.toLocaleString()} mismatched`:''}${ambiguous?` · ${ambiguous.toLocaleString()} ambiguous`:''}${stale?` · ${stale.toLocaleString()} stale`:''}${nasOnly?` · ${nasOnly.toLocaleString()} NAS-only`:''}${!unsafe?' · confirmed':''}`:(item.reconciliation==='nas_only'?'NAS only / unmatched':item.reconciliation==='ambiguous'?'Ambiguous physical path':item.reconciliation==='stale'?'Checksum proof stale':(item.reconciliation||item.state||'unknown'));const name=directory?`<button class="folder" type="button" data-path="${esc(item.relative_path||'')}">${esc(item.name||'')}</button>`:`<span class="mono">${esc(item.name||'')}</span>`;return`<tr><td aria-label="${directory?'Folder':'File'}">${directory?'📁':'▤'}</td><td class="name">${name}</td><td>${esc(bytes(item.size_bytes||0))}</td><td class="${reconciliationClass(directory?(ambiguous?'ambiguous':mismatch?'mismatch':stale?'stale':nasOnly?'nas_only':'confirmed'):item.reconciliation)}">${esc(state)}</td><td class="mono sha">${directory?'—':esc(item.sha256||'—')}</td><td>${directory?'—':esc(when(item.verified_at))}</td></tr>`;}
    function bindFolders(){fileRows.querySelectorAll('[data-path]').forEach(button=>button.addEventListener('click',()=>loadFolder(button.dataset.path||'')));}
    async function loadFolder(path='',cursor=''){
      if(!currentConnection)return;const generation=cursor?requestGeneration:++requestGeneration;if(!cursor){currentPath=path;nextCursor='';shown=0;fileRows.innerHTML='<tr><td colspan="6" class="empty">Loading NAS folder…</td></tr>';renderBreadcrumbs(path);upButton.disabled=!path;folderSummary.textContent='Loading…';moreButton.hidden=true;}
      try{const params=new URLSearchParams({limit:'200'});if(path)params.set('path',path);if(cursor)params.set('cursor',cursor);const data=await fetchJSON(`/api/v1/account/connections/${currentConnection}/inventory/tree?${params}`);if(generation!==requestGeneration||path!==currentPath)return;treeFresh=data.fresh===true;treeConsistent=data.snapshot_consistent===true;treeGeneration=String(data.generation||'');if(!cursor&&path===''&&data.server_only!==undefined)rootServerOnly=Number(data.server_only||0);const entries=Array.isArray(data.entries)?data.entries:[];const rows=entries.map(rowHTML).join('');if(!cursor)fileRows.innerHTML=rows||'<tr><td colspan="6" class="empty">This folder is empty, or its inventory has not synced yet.</td></tr>';else fileRows.insertAdjacentHTML('beforeend',rows);shown+=entries.length;nextCursor=String(data.next_cursor||'');const safety=data.snapshot_available!==true?'A completed filesystem tree is not available yet; green confirmation is disabled.':treeConsistent?(treeFresh?`Completed generation ${treeGeneration||'unknown'} is current.`:`Completed generation ${treeGeneration||'unknown'} is stale; green confirmation is disabled.`):data.in_progress_generation?`A newer scan (${data.in_progress_generation}) is in progress; folder totals are from completed generation ${treeGeneration||'unknown'}, and paging restarts if live files change.`:`Live file proofs changed after completed generation ${treeGeneration||'unknown'}; folder totals and green confirmation are paused until the next completed scan.`;folderSummary.textContent=`${shown.toLocaleString()} entries shown · ${rootServerOnly.toLocaleString()} server-only clips across this NAS. ${safety}`;folderSummary.className='status'+(treeFresh&&treeConsistent?'':' err');moreButton.hidden=!nextCursor;bindFolders();}
      catch(error){if(generation!==requestGeneration)return;if(cursor&&error.status===409){nextCursor='';moreButton.hidden=true;folderSummary.textContent='Live files changed while paging; restarting this folder…';void loadFolder(path);return;}if(!cursor)fileRows.innerHTML=`<tr><td colspan="6" class="empty state-err">${esc(error.message||error)}</td></tr>`;else folderSummary.textContent=`Could not load the next page: ${error.message||error}`;}
    }
    async function loadConnections(){
      try{const data=await fetchJSON('/api/v1/account/connections');connections=Array.isArray(data.items)?data.items:[];if(!connections.length){connectionSelect.innerHTML='<option>No NAS connections</option>';connectionSelect.disabled=true;connectionStatus.textContent='Connect a NAS in Org settings to browse its files.';return;}const requested=Number(new URLSearchParams(location.search).get('connection')||0);connectionSelect.innerHTML=connections.map(c=>`<option value="${Number(c.id)}">${esc(c.label||`NAS ${c.id}`)}</option>`).join('');currentConnection=connections.some(c=>Number(c.id)===requested)?requested:Number(connections[0].id);connectionSelect.value=String(currentConnection);selectConnection(currentConnection);}
      catch(error){connectionStatus.className='status err';connectionStatus.textContent=String(error.message||error);}
    }
    function selectConnection(id){currentConnection=Number(id);currentPath='';nextCursor='';rootServerOnly=0;treeFresh=false;treeConsistent=false;treeGeneration='';const connection=connections.find(item=>Number(item.id)===currentConnection);renderConnection(connection);csvLink.href=`/api/v1/account/connections/${currentConnection}/inventory.csv`;const url=new URL(location.href);url.searchParams.set('connection',String(currentConnection));history.replaceState(null,'',url.pathname+url.search);void loadFolder('');}
    connectionSelect.addEventListener('change',()=>selectConnection(connectionSelect.value));
    upButton.addEventListener('click',()=>{const i=currentPath.lastIndexOf('/');void loadFolder(i<0?'':currentPath.slice(0,i));});
    moreButton.addEventListener('click',()=>{if(!nextCursor)return;moreButton.disabled=true;loadFolder(currentPath,nextCursor).finally(()=>{moreButton.disabled=false;});});
    void loadConnections();
  </script>
</body>
</html>
