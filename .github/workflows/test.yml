name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: stoarama_test
          POSTGRES_USER: stoarama
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoarama -d stoarama_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test PostgreSQL type boundaries
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./internal/recordingnaming -run TestLockOrganizationPlazaIDsAcceptsIntegerAccountID -count=1
      - name: Test NAS backlog eligibility
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./internal/api -run 'Test(ConnectionPendingClipsEligibility|NASInventoryTreeBrowsesImmediateChildrenWithKeysetPagination|NASInventorySyncIsMonotonicAndCompletionSweepIsRaceSafe|NASInventoryReleaseGateFailsClosed|NASBatchReleaseIsAtomicAndInventoryGated|NASInventoryCSVUsesOneRepeatableReadSnapshot)' -count=1
      - name: Test batch Plaza naming
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./internal/api -run TestBatchSchedulePersistsPlazaHourlyNamingAndDaytimeWindow -count=1
      - name: Test recording upload intent replay
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./internal/api -run TestRecordingUploadIntentReplaysPendingAndConsumedSegment -count=1
      - name: Test migration lock timeout
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./internal/db -run TestMigrateUpAbortsWhenLockIsHeld -count=1
      # The continuous-window revive rules decide whether a 12-hour window resumes
      # after a failure or stays forfeited, and every test covering them is
      # DB-backed, so they all skipped in CI until this step named them.
      - name: Test continuous window revive rules
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./internal/recsched -run 'TestContinuous(Revives|DoesNotRevive)' -count=1
      # A forced droplet roll assumes a draining droplet stops taking work; if that
      # ever regressed, the drain would look clean while the old capture binary kept
      # leasing new windows until the drain timeout killed it mid-capture.
      - name: Test recorder lease gating and relay balancing
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./internal/api -run 'Test(RecordingJobsLease(RespectsDropletCapacityOne|RefusesDrainingDroplet)|RelayGroupLeaseCapConcurrent)' -count=1
      - name: Test provisioning teardown lease safety
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./internal/dropletpool -run TestReconcileOverdueProvisioningLeaseSafety -count=1
      # Backtested against the Zanzibar drift; DB-backed, so it needs naming here
      # or it silently skips like the rest of this suite did.
      - name: Test clip timestamp drift signal
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./cmd/stoaramactl -run TestDetectClipTimestampDrift -count=1
      - name: Test recording health alert delivery
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./cmd/stoaramactl -run 'Test(HealthAlertDeliveryTimestamp|RecordingHealthRunLock|CurrentRelayCapacityCollapsesGroupsAndPreservesUngroupedDomains)' -count=1
      - name: Test transient ledger retention boundaries
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./cmd/stoaramactl -run TestMaintainTransientLedgersDeletesOnlyExpiredBookkeeping -count=1
      - name: Test billing meter report ledger
        env:
          STOARAMA_TEST_DATABASE_URL: postgres://stoarama@localhost:5432/stoarama_test?sslmode=disable
        run: go test ./cmd/stoaramactl -run TestMeterReportLedgerFailsClosedOnAmbiguousRetry -count=1
      - name: Test
        run: go test ./...
      - name: Test NAS pull client
        working-directory: .
        run: python3 -m unittest -q clients/nas-pull/test_stoarama_pull.py
      - name: Vet
        run: go vet ./...
